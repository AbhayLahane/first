<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Web Page</title>
    <style>
body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f9;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.container {
    background: #ffffff;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    text-align: center;
    max-width: 400px;
}

h1 {
    color: #333333;
}

button {
    background-color: #007bff;
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 16px;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 15px;
    transition: background-color 0.2s ease;
}

button:hover {
    background-color: #0056b3;
}

#message {
    margin-top: 15px;
    font-weight: bold;
    color: #28a745;
}

    </style>
</head>
<body>
    <div class="container">
        <h1>Hello World!</h1>
        <p>This is a starter web page template with HTML, CSS, and JavaScript combined into one file.</p>
        <button id="clickBtn">Click Me</button>
        <p id="message"></p>
    </div>
    <script>
document.getElementById('clickBtn').addEventListener('click', function() {
    const messageElement = document.getElementById('message');
    messageElement.textContent = 'Button clicked successfully!';
});

    </script>
</body>
</html>
